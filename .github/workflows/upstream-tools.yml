name: Build upstream 0.3.1 tools

# Builds the `tools` artifact from XuexGao's 0.3.1 branch (oppo-r9s-a57), so
# the same shipper that flashes our own builds can try that tree on the phone
# without this repository having to carry it.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upstream-tools.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: XuexGao/skyward
          ref: oppo-r9s-a57
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1
